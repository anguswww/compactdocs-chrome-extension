<!doctype html>
<html lang="en"><meta charset="utf-8"><title>CompactDocs</title>
<style>body{width:280px;margin:20px;font:14px/1.5 system-ui;color:#172b28}h1{font-size:20px;margin:0 0 8px}label{display:flex;gap:10px;margin:16px 0}input{accent-color:#18765b}p{color:#52635e;font-size:12px}</style>
<h1>CompactDocs</h1>
<label><input type="checkbox" id="collapseTabs">Show full document tabs on hover</label>
<label><input type="checkbox" id="hideRightPanel">Show right side panel on hover</label>
<label><input type="checkbox" id="fitToWindow">Fit page to the reclaimed window width</label>
<p>Hover over the small edge buttons to reveal panels over your document. Move back to the editor to hide them. You can also Tab to a button or click it; Escape closes the panel.</p>
