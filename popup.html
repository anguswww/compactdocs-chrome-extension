<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CompactDocs</title>
<style>
*{box-sizing:border-box}
body{width:320px;margin:0;padding:24px;font:14px/1.5 system-ui,sans-serif;color:#25332f;background:#f8faf9}
header{display:flex;align-items:center;gap:12px;margin-bottom:22px}
header img{width:36px;height:36px}
h1{font-size:19px;letter-spacing:-.5px;margin:0}
header p{margin:1px 0 0;font-size:12px;color:#5d6b65}
.options{border:1px solid #dce5df;border-radius:14px;background:#fff;padding:0 14px}
label{display:flex;align-items:flex-start;gap:12px;padding:14px 0;cursor:pointer}
label+label{border-top:1px solid #edf1ee}
input{width:17px;height:17px;margin:3px 0 0;accent-color:#18765b;flex-shrink:0}
input:focus-visible{outline:2px solid #18765b;outline-offset:3px}
label span{display:block;font-weight:550}
small{display:block;margin-top:2px;color:#5d6b65;font-size:12px;font-weight:400}
.help{font-size:12px;color:#5d6b65;margin:18px 0 0}
kbd{font:11px system-ui;padding:1px 4px;border:1px solid #dce5df;border-radius:4px;background:#fff}
</style>
</head>
<body>
<header><img src="assets/icon-48.png" alt=""><div><h1>CompactDocs</h1><p>A little more room to write.</p></div></header>
<div class="options">
<label><input type="checkbox" id="collapseTabs"><span>Document tabs<small>Keep tucked away. Reveal at the left edge.</small></span></label>
<label><input type="checkbox" id="hideRightPanel"><span>Google side panel<small>Keep tucked away. Reveal at the right edge.</small></span></label>
<label><input type="checkbox" id="fitToWindow"><span>Fit page to window<small>Use the extra room in paged documents.</small></span></label>
</div>
<p class="help">Hover anywhere along the left or right edge to reveal a panel. Click or use <kbd>Tab</kbd> for keyboard access. Press <kbd>Esc</kbd> to close.</p>
<script src="popup.js"></script>
</body>
</html>
