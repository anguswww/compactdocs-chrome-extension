name: Website
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/website.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update generated gh-pages branch
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/compactdocs-pages"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            git worktree add --detach "$DEST" FETCH_HEAD
          else
            git worktree add --detach "$DEST" HEAD
            (cd "$DEST" && git checkout --orphan gh-pages && git rm -rf .)
          fi
          rsync -a --delete --exclude=.git site/ "$DEST/"
          cd "$DEST"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Deploy website from $GITHUB_SHA"
            git push origin HEAD:refs/heads/gh-pages
          fi
      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    if: ${{ vars.PAGES_ENABLED == 'true' }}
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
