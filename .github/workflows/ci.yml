name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Test, check syntax, and build release ZIP
        run: npm run package
      - name: Build and verify store assets
        run: |
          python3 -m venv "$RUNNER_TEMP/store-assets-env"
          "$RUNNER_TEMP/store-assets-env/bin/pip" install Pillow==12.0.0
          "$RUNNER_TEMP/store-assets-env/bin/python" scripts/generate-store-assets.py --check
          "$RUNNER_TEMP/store-assets-env/bin/python" scripts/generate-store-assets.py
      - name: Ensure generated styles are current
        run: git diff --exit-code -- styles.js
      - name: Keep tested package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compactdocs-package
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
